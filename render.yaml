services:
  - type: web
    name: api-unifind
    env: node
    plan: free
    buildCommand: npm install --production
    startCommand: node index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
